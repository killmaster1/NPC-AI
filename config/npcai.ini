# NPC AI 2.4.0 — arquivo de exemplo sem credenciais.
# Local primário: diretório files retornado pelo AML (inclui Android_unprotected).
# Sem esse arquivo, usa npcai.ini no GetConfigPath do AML, se existir.
# Espaços, BOM UTF-8, CRLF e comentários # / ; são aceitos.
# Duplicatas conflitantes de voz são rejeitadas; mantenha um único bloco TTS.
# Reinicie o GTA após alterar. Abra NPC AI · Diagnóstico sem precisar de ADB.
# Nunca coloque OPENAI_API_KEY aqui. token é só a senha do servidor local.
token=
radius=3.0
connect_timeout_ms=1500
request_timeout_ms=28000
history_limit=24

# Altura fallback em metros; com bounds, ajusta altura por (valor - 1.75).
bubble_height=1.75
# Pixels ImGui entre a ponta do balão e a cabeça (positivo sobe).
bubble_screen_offset_y=6
npc_stand_still=1
npc_dialogue_animations=1

# Ações físicas 1.3.0; tarefas exclusivas do mod, removidas ao encerrar.
npc_face_player=1
npc_stop_on_talk=1
npc_ai_actions=1
npc_money_drop=1
npc_money_max=200
npc_money_pickups_max=5
npc_action_timeout_ms=10000
# Limites adicionais; orçamento e deduplicação duram até encerrar o processo GTA.
npc_money_session_max=5000
npc_money_repeat=0

# 1.4.0: duração do gesto é local; rendição/seguimento não expiram por duration_ms.
npc_hold_surrender=1
npc_surrender_release_distance=6.0
npc_surrender_release_delay_ms=2000
npc_follow_release_distance=25.0
npc_dialogue_reading_wpm=180
npc_dialogue_min_ms=2500
npc_dialogue_max_ms=12000
npc_personality_variation=1
npc_animation_debug=0
# 0 mantém os balões atuais em 15 s; 1 usa a estimativa local de leitura.
npc_bubble_dynamic_duration=0

# 2.0.0: funciona sem Termux/Python. 0 = Mock nativo gratuito; 1 = Gemini HTTPS.
npc_ai_transport=native
# Use legacy_http somente para compatibilidade opcional com o servidor antigo.
gemini_enabled=1
gemini_model=gemini-2.5-flash-lite
# Escolha um modelo disponível à sua conta; nomes futuros não são garantidos.
gemini_timeout_ms=25000
gemini_max_retries=2
# Recomendado: keystore. Para importar, preencha a chave temporariamente e use
# gemini_key_action=replace. Após credential_stored, apague a chave do INI e use none.
# Teste simples em texto puro: escolha explicitamente gemini_key_storage=ini.
# INI não protege contra apps/mods que consigam ler o arquivo.
gemini_key_storage=keystore
gemini_key_action=none
# none / replace / remove; remove desabilita o uso da credencial nessa inicialização.
# Chave aceita letras, números, ponto, _ e -, até 256 bytes.
# Aspas externas simples/duplas são opcionais e removidas pelo parser.
gemini_api_key=

npc_memory_enabled=1
npc_memory_autosave_seconds=10
npc_memory_persistent=1
npc_memory_max_mb=10
npc_memory_global=1
npc_memory_individual=1
# auto usa slot confirmado por hook de load/save. Sem hook, isola a sessão.
# Perfil manual opcional, ex.: minha_partida_1; troque-o ao trocar de save.
npc_memory_profile=auto
# 1 limpa o perfil ao iniciar/carregar; volte para 0 após a limpeza desejada.
npc_memory_clear=0
# 0 mantém a memória persistente no aparelho. 1 permite enviar resumos limitados
# ao Gemini ao conversar. Histórico curto da conversa atual e contexto atual são enviados.
npc_memory_send_context=0
npc_context_tokens=2048

npc_perplexity_enabled=1
npc_perplexity_decay=1
npc_perplexity_gain=1.0
world_perception=1
world_perception_interval_ms=500
world_event_memory=1
world_expectations=1
world_max_active_expectations=3
npc_reaction_mode=economy
npc_spontaneous_ai=0
npc_spontaneous_cooldown_s=60
npc_spontaneous_budget_hour=4

# NPC AI — voz local Kokoro FP32. Modelo separado, sem Termux.
npc_tts_enabled=1
npc_tts_engine=elevenlabs
npc_tts_language=pt-BR
npc_tts_model=kokoro-pt-br
# Speakers exclusivos do pacote brasileiro verificado.
npc_tts_voice=pm_alex
# 1: voz determinística pela identidade de sessão; 0: usa a voz padrão acima.
npc_tts_voice_variation=1
npc_tts_threads=2
npc_tts_speed=1.0
npc_tts_volume=0.85
npc_tts_spatial_audio=1
npc_tts_max_distance=15
npc_tts_stop_on_distance=1
npc_tts_sync_animation=1
npc_tts_cache_enabled=1
# Prazo cooperativo: inferência em andamento só termina no callback da frase.
npc_tts_timeout_ms=45000
# 0 mantém sessão; 60 libera após 60 s sem falas. Reabrir custa inicialização.
npc_tts_idle_unload_seconds=0
# Verificação preventiva de MemAvailable antes de inicializar (0 desativa; não é teto de RSS).
npc_tts_min_available_mb=900

# 2.4.0: ElevenLabs é independente do Gemini. Padrão v3 conforme solicitação atual.
# Flash v2.5 continua disponível: eleven_flash_v2_5 (não recebe tags).
elevenlabs_model=eleven_v3
elevenlabs_key_storage=keystore
elevenlabs_key_action=none
# Para ini plaintext, escolha explicitamente storage=ini; nunca publique sua chave.
elevenlabs_api_key=
elevenlabs_voice_assignment=character_id
elevenlabs_voice_variation=1
# IDs reais da sua conta, separados por vírgula; vazio exige Consultar vozes no menu.
elevenlabs_voice_ids=
# Mapeamento opcional modelo:VoiceID,modelo:VoiceID. Nenhum ID fictício é distribuído.
elevenlabs_model_voices=
# Reservado a identificadores realmente verificados; a ponte atual não identifica personagens nomeados.
elevenlabs_character_voices=
elevenlabs_timeout_ms=25000
# Orçamento orienta o Gemini. Falas sem frase completa dentro do teto ficam somente em texto.
elevenlabs_target_chars=150
elevenlabs_max_chars=200
elevenlabs_cache_enabled=1
elevenlabs_cache_persistent=1
elevenlabs_cache_max_mb=150
# Estimativa conservadora por caractere enviado, incluindo tags. Ajuste ao seu plano/modelo.
elevenlabs_credit_per_char=1.0
# 0 desativa o respectivo teto. São limites locais estimados, não faturamento oficial.
elevenlabs_credit_limit_day=1000
elevenlabs_credit_limit_hour=250
npc_emotions_enabled=1
npc_emotion_intensity=0.7
npc_aggression_multiplier=0.65
npc_relationship_recovery=1
npc_profanity_level=1
npc_profanity_repetition_control=1
# Memória de traços é da identidade de sessão; não identifica outro pedestre após reiniciar.
npc_personality_persistent=1
